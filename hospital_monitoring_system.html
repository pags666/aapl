<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hospital Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1b3e,#1a2f5e);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e3a6e}
.header h1{font-size:17px;font-weight:600;color:#60a5fa;letter-spacing:.5px}
.header .sub{font-size:12px;color:#94a3b8;margin-top:2px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.top-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 16px;background:#080d1c}
.stat-card{background:#0f1a2e;border:1px solid #1e3a6e;border-radius:8px;padding:10px 14px}
.stat-card .val{font-size:22px;font-weight:700}
.stat-card .lbl{font-size:11px;color:#64748b;margin-top:2px}
.stat-card.ok .val{color:#22c55e}
.stat-card.warn .val{color:#f59e0b}
.stat-card.crit .val{color:#ef4444}
.stat-card.info .val{color:#60a5fa}
.main{padding:12px 16px;display:flex;gap:12px}
.treemap-area{flex:1;min-width:0}
.treemap-title{font-size:13px;color:#94a3b8;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b;margin-bottom:8px}
.breadcrumb span{cursor:pointer;color:#60a5fa}
.breadcrumb span:hover{text-decoration:underline}
.treemap{display:grid;gap:6px;width:100%}
.treemap.dept{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.treemap.patient{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tm-cell{border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.tm-cell:hover{transform:scale(1.03);border-color:rgba(255,255,255,.4);z-index:2}
.tm-cell .cell-label{font-size:13px;font-weight:600;margin-bottom:4px}
.tm-cell .cell-sub{font-size:11px;opacity:.8}
.tm-cell .cell-badge{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.bg-crit{background:#3d0000;border-color:#7f1d1d}
.bg-warn{background:#2d1a00;border-color:#78350f}
.bg-ok{background:#002d1a;border-color:#14532d}
.badge-crit{background:#7f1d1d;color:#fca5a5}
.badge-warn{background:#78350f;color:#fcd34d}
.badge-ok{background:#14532d;color:#86efac}
.side-panel{width:340px;flex-shrink:0;background:#080d1c;border:1px solid #1e3a6e;border-radius:10px;overflow:hidden}
.panel-header{background:#0f1a2e;padding:12px 16px;border-bottom:1px solid #1e3a6e}
.panel-header h3{font-size:14px;font-weight:600;color:#60a5fa}
.panel-body{padding:14px;height:540px;overflow-y:auto}
.vital-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e3a6e}
.vital-row:last-child{border-bottom:none}
.vital-lbl{font-size:12px;color:#94a3b8}
.vital-val{font-size:14px;font-weight:600}
.vital-val.ok{color:#22c55e}
.vital-val.warn{color:#f59e0b}
.vital-val.crit{color:#ef4444}
.ai-section{margin-top:12px;background:#0d1b2a;border:1px solid #1e40af;border-radius:8px;padding:12px}
.ai-title{font-size:12px;color:#60a5fa;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-text{font-size:12px;color:#cbd5e1;line-height:1.6}
.ai-loading{font-size:12px;color:#64748b;font-style:italic}
.risk-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:10px}
.risk-high{background:#7f1d1d;color:#fca5a5}
.risk-med{background:#78350f;color:#fcd34d}
.risk-low{background:#14532d;color:#86efac}
.history-entry{background:#0f1a2e;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.history-date{color:#64748b;font-size:11px;margin-bottom:3px}
.tab-row{display:flex;border-bottom:1px solid #1e3a6e;margin-bottom:12px}
.tab{padding:8px 14px;font-size:12px;cursor:pointer;color:#64748b;border-bottom:2px solid transparent}
.tab.active{color:#60a5fa;border-bottom-color:#60a5fa}
.legend{display:flex;gap:12px;align-items:center;font-size:11px;color:#64748b;margin-bottom:8px}
.legend-dot{width:10px;height:10px;border-radius:2px}
.anomaly-alert{background:#1f0a0a;border:1px solid #7f1d1d;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.anomaly-title{color:#f87171;font-weight:600;font-size:11px;margin-bottom:3px}
.btn-back{background:#1e3a6e;border:none;color:#93c5fd;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:10px}
.btn-back:hover{background:#2563eb}
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:4px}
.spark-bar{width:6px;border-radius:2px 2px 0 0;background:#1d4ed8;transition:height .3s}
.spark-bar.hi{background:#ef4444}
.spark-bar.med{background:#f59e0b}
</style>
</head>
<body>
<div class="header">
  <div class="live-dot"></div>
  <div>
    <div class="h1" style="font-size:16px;font-weight:700;color:#60a5fa">AAPALLA CENTRAL HOSPITAL — MONITORING SYSTEM</div>
    <div class="sub">Real-time Ward & Patient Surveillance · AI Anomaly Detection</div>
  </div>
  <div style="margin-left:auto;font-size:11px;color:#475569" id="clock"></div>
</div>

<div class="top-stats" id="topStats"></div>

<div class="main">
  <div class="treemap-area">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="legend">
      <span class="legend-dot" style="background:#3d0000"></span> Critical (&lt;25% beds)
      <span class="legend-dot" style="background:#2d1a00"></span> Warning (25–50%)
      <span class="legend-dot" style="background:#002d1a"></span> Available (&gt;50%)
    </div>
    <div id="treemap" class="treemap dept"></div>
  </div>
  <div class="side-panel">
    <div class="panel-header"><h3 id="panelTitle">Select a department or patient</h3></div>
    <div class="panel-body" id="panelBody"><div style="color:#475569;font-size:13px;padding-top:20px;text-align:center">Click any department to explore wards, then click a patient for AI-powered analysis.</div></div>
  </div>
</div>

<script>
const DEPTS = [
  {id:'ER',name:'Emergency Ward',total:40,avail:4,admitted:36,risk:'crit',color:'#ef4444'},
  {id:'ICU',name:'Intensive Care Unit',total:20,avail:3,admitted:17,risk:'crit',color:'#ef4444'},
  {id:'CARD',name:'Cardiology',total:35,avail:10,admitted:25,risk:'warn',color:'#f59e0b'},
  {id:'NEURO',name:'Neurology',total:30,avail:9,admitted:21,risk:'warn',color:'#f59e0b'},
  {id:'KIDNEY',name:'Nephrology',total:25,avail:8,admitted:17,risk:'warn',color:'#f59e0b'},
  {id:'ORTHO',name:'Orthopaedics',total:40,avail:22,admitted:18,risk:'ok',color:'#22c55e'},
  {id:'PEDS',name:'Paediatrics',total:30,avail:18,admitted:12,risk:'ok',color:'#22c55e'},
  {id:'OBG',name:'Obs & Gynaecology',total:35,avail:20,admitted:15,risk:'ok',color:'#22c55e'},
  {id:'SURG',name:'General Surgery',total:45,avail:14,admitted:31,risk:'warn',color:'#f59e0b'},
  {id:'ONCO',name:'Oncology',total:28,avail:11,admitted:17,risk:'warn',color:'#f59e0b'},
  {id:'RESP',name:'Respiratory',total:30,avail:6,admitted:24,risk:'crit',color:'#ef4444'},
  {id:'PSYCH',name:'Psychiatry',total:20,avail:12,admitted:8,risk:'ok',color:'#22c55e'},
];

const PATIENTS = {
  ER:[
    {id:'P001',name:'Arjun Selvam',age:58,gender:'M',bed:'E-01',hr:112,bp:'155/98',spo2:91,temp:38.9,rr:24,risk:'High',
     dx:'Acute STEMI',admit:'13 Jun 2026',history:[{date:'2024-03',note:'Hypertension diagnosed, started Amlodipine'},
     {date:'2024-09',note:'Stress ECG — borderline ST changes'},
     {date:'2025-11',note:'Lipid panel: LDL 162 mg/dL, started statin'},
     {date:'2026-06',note:'Presented with crushing chest pain, diaphoresis'}],
     vitals_trend:[88,90,95,108,112]},
    {id:'P002',name:'Kavitha Rajan',age:42,gender:'F',bed:'E-02',hr:98,bp:'130/85',spo2:96,temp:37.2,rr:18,risk:'Medium',
     dx:'Dengue Fever Day 3',admit:'12 Jun 2026',history:[{date:'2025-01',note:'No significant past history'},
     {date:'2026-06',note:'Fever, body ache, platelet 68,000 — dengue NS1 positive'}],
     vitals_trend:[96,97,99,98,98]},
    {id:'P003',name:'Murugan P',age:71,gender:'M',bed:'E-03',hr:130,bp:'90/60',spo2:88,temp:39.5,rr:28,risk:'High',
     dx:'Septic Shock',admit:'14 Jun 2026',history:[{date:'2023-05',note:'DM Type 2, CKD Stage 3'},
     {date:'2026-06',note:'UTI with urosepsis, hypotensive, on vasopressors'}],
     vitals_trend:[102,118,125,128,130]},
    {id:'P004',name:'Priya Nair',age:29,gender:'F',bed:'E-04',hr:82,bp:'118/76',spo2:99,temp:36.8,rr:16,risk:'Low',
     dx:'Minor Fracture R-wrist',admit:'14 Jun 2026',history:[{date:'2026-06',note:'Fall injury, X-ray confirmed undisplaced fracture'}],
     vitals_trend:[80,81,82,83,82]},
  ],
  ICU:[
    {id:'P010',name:'Srinivasan K',age:65,gender:'M',bed:'I-01',hr:118,bp:'80/50',spo2:86,temp:40.1,rr:32,risk:'High',
     dx:'ARDS Post-COVID',admit:'10 Jun 2026',history:[{date:'2026-06',note:'COVID pneumonia, intubated, FiO2 80%'}],
     vitals_trend:[95,105,110,116,118]},
    {id:'P011',name:'Lakshmi Devi',age:72,gender:'F',bed:'I-02',hr:55,bp:'100/65',spo2:94,temp:37.8,rr:20,risk:'Medium',
     dx:'Post-CABG Day 2',admit:'12 Jun 2026',history:[{date:'2024-01',note:'Triple vessel CAD diagnosed'},
     {date:'2026-06',note:'CABG done, post-op monitoring, stable'}],
     vitals_trend:[72,65,60,57,55]},
  ],
  CARD:[
    {id:'P020',name:'Balaji T',age:54,gender:'M',bed:'C-01',hr:88,bp:'145/92',spo2:97,temp:37.0,rr:17,risk:'Medium',
     dx:'Unstable Angina',admit:'13 Jun 2026',history:[{date:'2023-08',note:'Hypertension, DM type 2'},
     {date:'2026-06',note:'Chest pain at rest, troponin borderline elevated'}],
     vitals_trend:[92,90,89,88,88]},
    {id:'P021',name:'Vijaya R',age:48,gender:'F',bed:'C-02',hr:72,bp:'128/80',spo2:98,temp:36.9,rr:16,risk:'Low',
     dx:'Paroxysmal AF',admit:'13 Jun 2026',history:[{date:'2025-04',note:'AF detected on Holter, rate controlled'},
     {date:'2026-06',note:'Palpitation episode, cardioverted to SR'}],
     vitals_trend:[90,85,78,74,72]},
  ],
  NEURO:[
    {id:'P030',name:'Chandran S',age:68,gender:'M',bed:'N-01',hr:95,bp:'170/100',spo2:95,temp:37.4,rr:19,risk:'High',
     dx:'Acute Ischaemic Stroke',admit:'14 Jun 2026',history:[{date:'2024-02',note:'Hypertension, previous TIA'},
     {date:'2026-06',note:'NIHSS 14, thrombolysis given within 3h window'}],
     vitals_trend:[88,90,93,94,95]},
  ],
  KIDNEY:[
    {id:'P040',name:'Meena S',age:55,gender:'F',bed:'K-01',hr:78,bp:'150/95',spo2:97,temp:37.0,rr:18,risk:'Medium',
     dx:'CKD Stage 4 — Dialysis',admit:'11 Jun 2026',history:[{date:'2021-01',note:'DM nephropathy, eGFR 18'},
     {date:'2026-06',note:'On HD 3x/week, potassium 6.2, monitoring AV fistula'}],
     vitals_trend:[76,77,78,78,78]},
  ],
};
for(const d of DEPTS){if(!PATIENTS[d.id])PATIENTS[d.id]=[]}

let currentDept=null;
let currentPatient=null;
let activeTab='vitals';
let aiCache={};

function pct(d){return Math.round(d.avail/d.total*100)}
function bgClass(d){const p=pct(d);return p<25?'bg-crit':p<50?'bg-warn':'bg-ok'}
function badgeClass(d){const p=pct(d);return p<25?'badge-crit':p<50?'badge-warn':'badge-ok'}

function renderTopStats(){
  const total=DEPTS.reduce((s,d)=>s+d.total,0);
  const occ=DEPTS.reduce((s,d)=>s+d.admitted,0);
  const avail=total-occ;
  const critDepts=DEPTS.filter(d=>pct(d)<25).length;
  const hiRisk=Object.values(PATIENTS).flat().filter(p=>p.risk==='High').length;
  document.getElementById('topStats').innerHTML=`
    <div class="stat-card info"><div class="val">${total}</div><div class="lbl">Total Beds</div></div>
    <div class="stat-card warn"><div class="val">${occ}</div><div class="lbl">Occupied</div></div>
    <div class="stat-card ok"><div class="val">${avail}</div><div class="lbl">Available</div></div>
    <div class="stat-card crit"><div class="val">${critDepts}</div><div class="lbl">Critical Wards</div></div>
    <div class="stat-card crit"><div class="val">${hiRisk}</div><div class="lbl">High Risk Patients</div></div>`;
}

function renderDepts(){
  currentDept=null;currentPatient=null;
  const tm=document.getElementById('treemap');
  tm.className='treemap dept';
  tm.innerHTML=DEPTS.map(d=>`
    <div class="tm-cell ${bgClass(d)}" onclick="openDept('${d.id}')" style="min-height:80px">
      <span class="cell-badge ${badgeClass(d)}">${pct(d)}%</span>
      <div class="cell-label">${d.name}</div>
      <div class="cell-sub">${d.avail}/${d.total} beds free</div>
      <div class="cell-sub" style="margin-top:4px">${d.admitted} admitted</div>
    </div>`).join('');
  renderBreadcrumb();
  document.getElementById('panelTitle').textContent='Hospital Overview';
  document.getElementById('panelBody').innerHTML=`<div style="color:#475569;font-size:13px;padding-top:20px;text-align:center">Click any department ward to see patients.</div>`;
}

function openDept(id){
  currentDept=id;currentPatient=null;
  const d=DEPTS.find(x=>x.id===id);
  const pts=PATIENTS[id]||[];
  const tm=document.getElementById('treemap');
  tm.className='treemap patient';
  if(pts.length===0){
    tm.innerHTML=`<div style="color:#475569;font-size:13px;padding:20px">No patient data loaded for this ward.</div>`;
  } else {
    tm.innerHTML=pts.map(p=>{
      const rc=p.risk==='High'?'bg-crit':p.risk==='Medium'?'bg-warn':'bg-ok';
      const bc=p.risk==='High'?'badge-crit':p.risk==='Medium'?'badge-warn':'badge-ok';
      return `<div class="tm-cell ${rc}" onclick="openPatient('${id}','${p.id}')" style="min-height:90px">
        <span class="cell-badge ${bc}">${p.risk}</span>
        <div class="cell-label">${p.id}</div>
        <div class="cell-sub">${p.name}</div>
        <div class="cell-sub">Bed ${p.bed}</div>
        <div class="cell-sub">HR: ${p.hr} · SpO₂: ${p.spo2}%</div>
      </div>`}).join('');
  }
  renderBreadcrumb();
  document.getElementById('panelTitle').textContent=d.name;
  document.getElementById('panelBody').innerHTML=`
    <div class="vital-row"><span class="vital-lbl">Total Beds</span><span class="vital-val info" style="color:#60a5fa">${d.total}</span></div>
    <div class="vital-row"><span class="vital-lbl">Admitted</span><span class="vital-val warn">${d.admitted}</span></div>
    <div class="vital-row"><span class="vital-lbl">Available</span><span class="vital-val ok">${d.avail}</span></div>
    <div class="vital-row"><span class="vital-lbl">Occupancy</span><span class="vital-val ${pct(d)<25?'crit':pct(d)<50?'warn':'ok'}">${100-pct(d)}%</span></div>
    <div class="vital-row"><span class="vital-lbl">High Risk</span><span class="vital-val crit">${(PATIENTS[id]||[]).filter(p=>p.risk==='High').length}</span></div>
    <div style="margin-top:12px;font-size:12px;color:#64748b">Click a patient cell to view full clinical details and AI analysis.</div>`;
}

function openPatient(deptId,pid){
  const p=(PATIENTS[deptId]||[]).find(x=>x.id===pid);
  if(!p)return;
  currentPatient=p;activeTab='vitals';
  renderPatientPanel(p);
  renderBreadcrumb();
}

function setTab(t){activeTab=t;if(currentPatient)renderPatientPanel(currentPatient)}

function renderPatientPanel(p){
  document.getElementById('panelTitle').textContent=`${p.id} · ${p.name}`;
  const riskCls=p.risk==='High'?'risk-high':p.risk==='Medium'?'risk-med':'risk-low';
  const hrCls=p.hr>100||p.hr<50?'crit':p.hr>90?'warn':'ok';
  const spo2Cls=p.spo2<92?'crit':p.spo2<95?'warn':'ok';
  const bpTop=parseInt(p.bp);
  const bpCls=bpTop>150||bpTop<90?'crit':bpTop>130?'warn':'ok';
  const tempCls=p.temp>38.5?'crit':p.temp>37.5?'warn':'ok';
  const rrCls=p.rr>24||p.rr<10?'crit':p.rr>20?'warn':'ok';

  const sparkHtml=p.vitals_trend.map((v,i)=>{
    const h=Math.round((v/140)*28);
    const cls=v>100?'hi':v>90?'med':'';
    return `<div class="spark-bar ${cls}" style="height:${h}px"></div>`;
  }).join('');

  let bodyHtml=`<span class="risk-badge ${riskCls}">⬤ ${p.risk} Risk</span>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:10px">Dx: ${p.dx} · Bed ${p.bed} · Age ${p.age}${p.gender} · Admitted ${p.admit}</div>
    <div class="tab-row">
      <div class="tab ${activeTab==='vitals'?'active':''}" onclick="setTab('vitals')">Vitals</div>
      <div class="tab ${activeTab==='history'?'active':''}" onclick="setTab('history')">History</div>
      <div class="tab ${activeTab==='ai'?'active':''}" onclick="setTab('ai')">AI Analysis</div>
    </div>`;

  if(activeTab==='vitals'){
    bodyHtml+=`
      <div class="vital-row"><span class="vital-lbl">Heart Rate</span><span class="vital-val ${hrCls}">${p.hr} bpm</span></div>
      <div class="spark">${sparkHtml}</div>
      <div style="font-size:10px;color:#475569;margin-bottom:8px">HR trend (last 5 readings)</div>
      <div class="vital-row"><span class="vital-lbl">Blood Pressure</span><span class="vital-val ${bpCls}">${p.bp} mmHg</span></div>
      <div class="vital-row"><span class="vital-lbl">SpO₂</span><span class="vital-val ${spo2Cls}">${p.spo2}%</span></div>
      <div class="vital-row"><span class="vital-lbl">Temperature</span><span class="vital-val ${tempCls}">${p.temp}°F</span></div>
      <div class="vital-row"><span class="vital-lbl">Respiratory Rate</span><span class="vital-val ${rrCls}">${p.rr} /min</span></div>`;
  } else if(activeTab==='history'){
    bodyHtml+=p.history.map(h=>`
      <div class="history-entry">
        <div class="history-date">${h.date}</div>
        <div>${h.note}</div>
      </div>`).join('');
  } else if(activeTab==='ai'){
    const cacheKey=p.id;
    if(aiCache[cacheKey]){
      bodyHtml+=renderAIResult(aiCache[cacheKey]);
    } else {
      bodyHtml+=`<div class="ai-section">
        <div class="ai-title">🤖 AI Clinical Analysis</div>
        <div class="ai-loading" id="aiStatus">Analysing patient data...</div>
        <div id="aiContent"></div>
      </div>`;
      setTimeout(()=>runAI(p),100);
    }
  }
  document.getElementById('panelBody').innerHTML=bodyHtml;
}

function renderAIResult(res){
  return `<div class="ai-section">
    <div class="ai-title">🤖 AI Clinical Analysis</div>
    ${res.anomalies&&res.anomalies.length?res.anomalies.map(a=>`
      <div class="anomaly-alert">
        <div class="anomaly-title">⚠ ${a.param}</div>
        <div>${a.note}</div>
      </div>`).join(''):'<div style="color:#22c55e;font-size:12px;margin-bottom:8px">✓ No critical anomalies detected</div>'}
    <div class="ai-text" style="margin-top:8px"><b style="color:#93c5fd">Clinical Impression:</b><br>${res.impression}</div>
    <div class="ai-text" style="margin-top:8px"><b style="color:#93c5fd">Suggested Actions:</b><br>${res.actions}</div>
    <div style="font-size:10px;color:#475569;margin-top:10px">AI-assisted — always verify with clinical judgement</div>
  </div>`;
}

async function runAI(p){
  const prompt=`You are an AI clinical decision support system in a hospital. Analyse this patient and respond ONLY as a JSON object with no markdown, no extra text:
{
  "anomalies": [{"param":"string","note":"string"}],
  "impression": "2-3 sentence clinical summary",
  "actions": "2-3 specific clinical recommendations for the treating doctor"
}

Patient: ${p.name}, Age ${p.age}${p.gender}
Diagnosis: ${p.dx}
Vitals: HR ${p.hr}bpm, BP ${p.bp}mmHg, SpO2 ${p.spo2}%, Temp ${p.temp}°F, RR ${p.rr}/min
HR Trend: ${p.vitals_trend.join(', ')}
Medical History: ${p.history.map(h=>h.note).join('; ')}
Risk Level: ${p.risk}

Identify any vital sign anomalies, explain the clinical impression, and suggest specific interventions. Be concise and evidence-based.`;

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await res.json();
    let text=data.content.map(c=>c.text||'').join('');
    text=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(text);
    aiCache[p.id]=parsed;
    const el=document.getElementById('panelBody');
    if(el&&currentPatient&&currentPatient.id===p.id&&activeTab==='ai'){
      document.getElementById('aiStatus').style.display='none';
      document.getElementById('aiContent').innerHTML=renderAIResult(parsed).replace('<div class="ai-section"><div class="ai-title">🤖 AI Clinical Analysis</div>','').replace('</div>','');
      const sec=el.querySelector('.ai-section');
      if(sec)sec.innerHTML=`<div class="ai-title">🤖 AI Clinical Analysis</div>`+renderAIResult(parsed).replace(/<div class="ai-section">|<\/div>$/g,'');
      renderPatientPanel(p);
    }
  } catch(e){
    const s=document.getElementById('aiStatus');
    if(s)s.textContent='AI analysis unavailable. Please check connection.';
  }
}

function renderBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  let html=`<span onclick="renderDepts()">🏥 All Wards</span>`;
  if(currentDept){
    const d=DEPTS.find(x=>x.id===currentDept);
    html+=` › <span onclick="openDept('${currentDept}')">${d.name}</span>`;
  }
  if(currentPatient){
    html+=` › <span>${currentPatient.name}</span>`;
  }
  bc.innerHTML=html;
}

function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' IST · '+now.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

renderTopStats();
renderDepts();
updateClock();
setInterval(updateClock,1000);
</script>
